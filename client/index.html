<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Gracia Fab — AI-Powered Beauty Advisor</title>
    <meta name="description" content="Gracia Fab is a beauty store in Umuahia, Abia State, selling skincare, hair products, wigs and bridal beauty, now online with delivery across Nigeria for ₦2,500. Our AI tools help you choose." />
    <meta name="keywords" content="beauty Nigeria, skincare Nigeria, haircare Nigeria, wigs Umuahia, bridal beauty Nigeria, AI beauty" />
    <meta name="author" content="Gracia Fab" />
    <meta name="app-version" content="%APP_VERSION%" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FE938C" />

    <!-- Open Graph -->
    <meta property="og:title" content="Gracia Fab — Beauty store in Umuahia, now online" />
    <meta property="og:description" content="Skincare, hair products, wigs and bridal beauty from our Umuahia store, delivered across Nigeria for ₦2,500." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%/logo.png" />
    <meta property="og:site_name" content="Gracia Fab" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gracia Fab — Beauty store in Umuahia, now online" />
    <meta name="twitter:description" content="Skincare, hair products, wigs and bridal beauty from our Umuahia store, delivered across Nigeria for ₦2,500." />
    <meta name="twitter:image" content="%SITE_URL%/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["OnlineStore", "HealthAndBeautyBusiness"],
      "name": "Gracia Fab",
      "description": "Beauty store in Umuahia North, Abia State, selling skincare, hair products, wigs and bridal beauty since 2024, now online with nationwide delivery. In store: hair salon, wig installs, bridal makeup and consultations.",
      "foundingDate": "2024",
      "parentOrganization": { "@type": "Organization", "name": "Bems Group" },
      "url": "%SITE_URL%",
      "logo": "%SITE_URL%/logo.png",
      "sameAs": [
        "https://www.instagram.com/thebemsgroup",
        "https://www.facebook.com/thebemsgroup"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Umuahia",
        "addressRegion": "Abia State",
        "addressCountry": "NG"
      },
      "telephone": "+2348037447068",
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "08:00",
        "closes": "18:00"
      }],
      "priceRange": "₦₦",
      "currenciesAccepted": "NGN",
      "paymentAccepted": "Credit Card, Bank Transfer, USSD"
    }
    </script>


    <!-- Fonts preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
