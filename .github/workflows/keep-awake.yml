name: Keep API awake

# Render's free plan puts the API to sleep after 15 minutes without traffic,
# so the next visitor waits ~30 s and the 10:00 marketing job can miss its slot.
# This pings /health every 10 minutes to keep it awake.
#
# - Free: the repository is public, so scheduled runs cost nothing.
# - One always-on free service uses ~744 of Render's 750 free hours a month;
#   a second free service on the same Render workspace would run out.
# - GitHub can start scheduled runs a few minutes late at busy times, so an
#   occasional sleep can still happen.
# - If the API stays down after the retries, the run fails and GitHub emails
#   whoever last changed this schedule: a free downtime alert.
# - GitHub pauses scheduled workflows after 60 days without commits; re-enable
#   it under Actions → Keep API awake if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API (waking it if asleep)
        env:
          URL: https://gracia-fab.onrender.com/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q '"healthy"' body.json; then
              echo "API healthy on attempt $attempt: $(cat body.json)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 20
          done
          echo "::error::The API at $URL did not report healthy after 3 attempts"
          exit 1
